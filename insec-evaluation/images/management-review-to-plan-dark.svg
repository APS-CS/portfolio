<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">From maturity review to an improvement plan</title><desc id="desc">Workflow overview for a group course project concerning the fictional company PillMedtech. Six documented assessment perspectives are Risk Management, Information Classification, Incident Management, Procurement, Competence and Follow-Up. The project used MSB Maturity Dialogue, MSB Metodstöd and ISO 27001 to develop a maturity assessment, recommendations and implementation planning with responsibilities for a simulated management discussion. The diagram summarises the documented approach; it does not show actual maturity scores, specific recommendations or implemented improvements. Source: insec-evaluation/README.md.</desc>
