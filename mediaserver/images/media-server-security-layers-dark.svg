<text x="235" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#e8edf4" font-weight="400" text-anchor="start">VLAN isolation  ·  Off-host logs  ·  Restore tests  ·  GPU validation</text>
<text x="56" y="952" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#aab5c3" font-weight="400" text-anchor="start">Access relationships, not packet flow. GPU access retains a path to a host driver.</text>
