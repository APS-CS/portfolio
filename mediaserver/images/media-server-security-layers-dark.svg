<text x="56" y="56" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8cc0ea" font-weight="700" text-anchor="start" letter-spacing="2">PROJECT 02  /  SECURITY BY DESIGN</text>
<text x="56" y="126" font-family="Georgia, Cambria, serif" font-size="46" fill="#e8edf4" font-weight="400" text-anchor="start">Jellyfin: access with boundaries</text>
<text x="56" y="170" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#aab5c3" font-weight="400" text-anchor="start">Restrict the entry points. Limit the process. Separate its access to resources.</text>
