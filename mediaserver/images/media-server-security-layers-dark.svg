<text x="490" y="881" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#e8edf4" font-weight="400" text-anchor="start">LUKS  ·  Security updates  ·  auditd  ·  SSH keys</text>
<text x="490" y="910" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#aab5c3" font-weight="400" text-anchor="start">Disk encryption protects locked storage, not a compromised running host.</text>
<rect x="56" y="975" width="1328" height="66" rx="13" fill="#101d30" stroke="#5a9bd3" stroke-width="1.5" opacity="1" stroke-dasharray="6 7"/>
