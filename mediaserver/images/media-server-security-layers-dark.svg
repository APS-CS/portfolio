<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">Jellyfin: access with boundaries</title><desc id="desc">Documented media server design. LAN or VPN access reaches a restricted host and non-root container. The service reads media, writes configuration and accesses a GPU render node. Public service access is not forwarded.</desc>
