<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Encryption leaves the original in place</title><desc id="desc">Symcryptool file flow. Encrypting report.txt with file.key writes report.txt.enc and leaves report.txt unchanged. Decrypting report.txt.enc with the same key writes decrypted_report.txt. Both the original and the decrypted output are plaintext. The key is read from a file by each operation; its separate placement in this diagram does not imply enforced isolation or secure storage. These file names are examples. Source: symcryptool/cryptool.py and README.md, commit 6895f9061a0bfa9700c21fedeed0f90e67e13e23. Retention and round-trip behaviour checked with a disposable sample file. Existing files with the same output names can be overwritten.</desc>
