<text x="56" y="933" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#aab5c3" font-weight="400" text-anchor="start">Source: project README · SEC-02 · Reported assessment results</text>
<text x="1384" y="933" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#aab5c3" font-weight="400" text-anchor="end">Logic tests do not replace a live fallback test</text>
