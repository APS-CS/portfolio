<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">HTTPS: identify the protection layer</title><desc id="desc">The production proxy returned the HTTPS redirect before the site server handled the request. The site configuration previously checked only the host name and lacked HTTPS enforcement. A fallback rule was added and its logic tested with a simplified interpreter. The site-owned fallback has not been exercised live; requests already secured by the proxy pass through. Source: website-security-assessment/README.md, SEC-02, commit 592244fc18fa2fe19cc2b052b53b007c809e23ad. These are illustrations of reported results, not new tests.</desc>
