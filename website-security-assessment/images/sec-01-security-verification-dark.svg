<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc"><title id="title">Verifying a fix with the same test</title><desc id="desc">Focused comparison of SEC-01 in the public website security assessment. The same proof of concept calls the global PortalTT helper with an untrusted link on the before and after revisions. Before the fix, the input was accepted and the link was rendered. After the fix, the same call raised ReferenceError: PortalTT is not defined. The policy was restricted to fixed templates and its global helper removed. The finding was not independently exploitable. Page views are simplified illustrations of reported results, not screenshots. Source: website-security-assessment/README.md, SEC-01, commit 592244fc18fa2fe19cc2b052b53b007c809e23ad.</desc>
